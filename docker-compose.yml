version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hallbook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hallbook_db
      POSTGRES_USER: hallbook_user
      POSTGRES_PASSWORD: hallbook_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hallbook_user -d hallbook_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hallbook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: hallbook_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./static:/app/static

  celery-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: hallbook_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "default,payments,emails,media"]
    working_dir: /app/backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: hallbook_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    working_dir: /app/backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: hallbook_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
